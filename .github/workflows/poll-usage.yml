name: poll-usage

on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths-ignore:
      - "usage.json"
      - "notes.json"
      - "books.json"
      - "decisions.json"
      - "docs/**"
      - "practice/**"

permissions:
  contents: write

concurrency:
  group: poll-usage
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Poll every 5 minutes
        env:
          SESSION_KEYS: ${{ secrets.SESSION_KEYS }}
        run: |
          git config user.name  "usage-bot"
          git config user.email "usage-bot@users.noreply.github.com"
          for i in $(seq 1 66); do
            echo "--- iteration $i / 66 ---"
            node poll.mjs || echo "poll failed on iteration $i (continuing)"
            if ! git diff --quiet -- usage.json; then
              git add usage.json
              git commit -m "usage $(date -u +%Y-%m-%dT%H:%M)Z"
              git pull --rebase --autostash origin main || true
              git push origin main || true
            fi
            if [ "$i" -lt 66 ]; then sleep 300; fi
          done
