name: poll-usage
on:
  push:
    branches: [main]
    paths-ignore: ["usage.json"]
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: poll-usage
  cancel-in-progress: true
jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Poll usage
        env:
          SESSION_KEYS: ${{ secrets.SESSION_KEYS }}
        run: node poll.mjs
      - name: Commit usage.json
        run: |
          git config user.name "usage-bot"
          git config user.email "usage-bot@users.noreply.github.com"
          git add usage.json
          git diff --staged --quiet || git commit -m "update usage"
          git push
